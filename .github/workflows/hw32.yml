name: HW32 CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime -t hw32-app:ci .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build lint target
        run: docker build --target lint -t hw32-lint:ci .

      - name: Extract lint report
        run: |
          mkdir -p artifacts
          container_id=$(docker create hw32-lint:ci)
          docker cp "$container_id:/tmp/lint-report.txt" artifacts/lint-report.txt
          docker rm "$container_id"
          cat artifacts/lint-report.txt

      - name: Upload lint artifact
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: artifacts/lint-report.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test target
        run: docker build --target test -t hw32-test:ci .

      - name: Extract pytest report
        run: |
          mkdir -p artifacts
          container_id=$(docker create hw32-test:ci)
          docker cp "$container_id:/tmp/pytest-report.xml" artifacts/pytest-report.xml
          docker rm "$container_id"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: artifacts/pytest-report.xml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Check deployed application
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8080/health

      - name: Stop deployment
        if: always()
        run: docker compose down -v

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          MESSAGE="HW32 CI/CD
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Lint: ${LINT_RESULT}
          Test: ${TEST_RESULT}
          Deploy: ${DEPLOY_RESULT}"

          curl --fail \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Send lint report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=HW32 lint report" \
            -F "document=@reports/lint-report/lint-report.txt" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      - name: Send pytest report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=HW32 pytest report" \
            -F "document=@reports/pytest-report/pytest-report.xml" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
      - test
      - deploy
      - notify
    if: always()

    steps:
      - name: Cleanup runner
        run: |
          docker container prune -f
          docker image prune -f
          docker builder prune -f
